apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fluent-bit-elastic-credentials
  namespace: dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: fluent-bit-elastic-credentials
    creationPolicy: Owner

  data:
    - secretKey: api_key
      remoteRef:
        key: /pharma/dev/fluent-bit/elastic
        property: api_key
